<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #eee; height: 100vh; display: flex; }

        #sidebar { width: 220px; background: #181825; padding: 15px; border-right: 1px solid #313244; overflow-y: auto; }
        #sidebar h3 { font-size: 14px; color: #a6adc8; margin-bottom: 10px; text-transform: uppercase; }
        .user-item { padding: 8px 10px; margin-bottom: 5px; border-radius: 6px; background: #313244; font-size: 14px; }
        .user-item::before { content: '●'; color: #a6e3a1; margin-right: 8px; font-size: 10px; }

        #main { flex: 1; display: flex; flex-direction: column; }
        #header { padding: 15px 20px; background: #181825; border-bottom: 1px solid #313244; font-weight: 600; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; background: #313244; word-wrap: break-word; }
        .msg.own { align-self: flex-end; background: #89b4fa; color: #1e1e2e; }
        .msg .author { font-size: 12px; font-weight: 600; color: #89b4fa; margin-bottom: 4px; }
        .msg.own .author { color: #1e1e2e; }
        .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; }

        #input-area { display: flex; padding: 15px; background: #181825; gap: 10px; border-top: 1px solid #313244; }
        #messageInput { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: #313244; color: #eee; font-size: 14px; outline: none; }
        #messageInput:focus { border-color: #89b4fa; }
        #sendBtn { padding: 12px 24px; border: none; border-radius: 8px; background: #89b4fa; color: #1e1e2e; font-weight: 600; cursor: pointer; font-size: 14px; }
        #sendBtn:hover { background: #74c7ec; }

        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        #login-box { background: #181825; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
        #login-box h2 { margin-bottom: 20px; }
        #login-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: #313244; color: #eee; margin-bottom: 15px; outline: none; }
        #login-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #89b4fa; color: #1e1e2e; font-weight: 600; cursor: pointer; }
        .system-msg { text-align: center; color: #a6adc8; font-size: 12px; font-style: italic; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2>💬 Вход в чат</h2>
        <input type="text" id="usernameInput" placeholder="Введите ваше имя..." maxlength="20" />
        <button onclick="login()">Войти</button>
    </div>
</div>

<div id="sidebar">
    <h3>Онлайн</h3>
    <div id="userList"></div>
</div>

<div id="main">
    <div id="header">Общий чат</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled />
        <button id="sendBtn" onclick="sendMessage()" disabled>Отправить</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script>
    let connection = null;
    let userName = '';

    async function login() {
        const input = document.getElementById('usernameInput');
        userName = input.value.trim();
        if (!userName) { alert('Введите имя'); return; }

        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        await startConnection();
    }

    async function startConnection() {
        connection = new signalR.HubConnectionBuilder()
            .withUrl("/chatHub")
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveMessage", (msg) => addMessage(msg));
        connection.on("LoadHistory", (messages) => {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            messages.forEach(m => addMessage(m, false));
            scrollBottom();
        });
        connection.on("UserList", (users) => {
            const list = document.getElementById('userList');
            list.innerHTML = users.map(u => `<div class="user-item">${escapeHtml(u)}</div>`).join('');
        });
        connection.on("UserJoined", (name) => addSystemMessage(`${name} присоединился`));
        connection.on("UserLeft", (name) => addSystemMessage(`${name} покинул чат`));

        try {
            await connection.start();
            await connection.invoke("JoinChat", userName);
        } catch (e) {
            console.error(e);
            alert('Ошибка подключения. Откройте F12 → Console для деталей.');
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !connection) return;

        try {
            await connection.invoke("SendMessage", userName, text);
            input.value = '';
        } catch (e) { console.error(e); }
    }

    function addMessage(msg, animate = true) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'msg' + (msg.userName === userName ? ' own' : '');

        const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU',
            { hour: '2-digit', minute: '2-digit' });

        div.innerHTML = `
            <div class="author">${escapeHtml(msg.userName)}</div>
            <div>${escapeHtml(msg.text)}</div>
            <div class="time">${time}</div>
        `;
        box.appendChild(div);
        if (animate) scrollBottom();
    }

    function addSystemMessage(text) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = `— ${text} —`;
        box.appendChild(div);
        scrollBottom();
    }

    function scrollBottom() {
        const box = document.getElementById('messages');
        box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('usernameInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') login();
    });
    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
